<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · AliceCode Level 4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>💜</text></svg>">
<link rel="preload" href="assets/fonts/nunito-latin-798ec6.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/baloo2-latin-4a324d.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="hero" id="lesson-head" style="padding:30px 10px 18px"></header>

  <div class="stage-wrap">
    <div class="stage" id="stage" role="region" aria-roledescription="slideshow" aria-label="Lesson slides"></div>
    <div class="slide-controls">
      <button id="prev" aria-label="Previous slide">‹</button>
      <div class="sc-mid">
        <div class="progress-dots" id="dots" role="group" aria-label="Go to a slide"></div>
        <div class="progress-bar" aria-hidden="true"><i id="pbar"></i></div>
        <span id="counter" aria-live="polite" aria-atomic="true"></span>
      </div>
      <button id="next" aria-label="Next slide">›</button>
    </div>
    <p class="center lesson-tip">
      <span class="tip-keys">Tip: click the slide · ← → keys · press F for fullscreen 😉</span>
      <span class="tip-touch">Swipe the slide or tap ‹ › to move 😉</span>
    </p>
  </div>

  <div id="below"></div>

</div>

<footer class="footer">Made with 💜 for the Level 4 builders · {Alice code} 2026–27<br>by <strong>Yana Ifraimov</strong></footer>

</body>
</html>
