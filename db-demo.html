<!-- React + Tailwind for the "Variables vs. Database" slides (db-demo.jsx).
     Lives in its own page so Tailwind never touches the rest of the hub;
     the deck shows it in an iframe: db-demo.html?part=before|after&embed=1
     db-demo.js + db-demo.css are pre-built from db-demo.jsx: sh scripts/build-db-demo.sh -->
<link rel="stylesheet" href="db-demo.css">
<style>
  /* scales the whole demo with the frame width, so it fits any slide size */
  html { font-size: clamp(9px, 1.55vw, 15px); }
  html, body { height: 100%; margin: 0; }
  body.embed { background: transparent; }
  /* glitch overlay: scanlines + RGB-split text */
  .scanlines {
    background: repeating-linear-gradient(0deg, rgba(36,20,54,.18) 0 2px, transparent 2px 5px),
                linear-gradient(90deg, rgba(255,0,80,.12), rgba(0,255,220,.12));
  }
  .rgb-split { text-shadow: -3px 0 rgba(255,0,80,.9), 3px 0 rgba(0,230,255,.9); }
  /* the data beam between panels */
  .beam-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: beam-draw .6s ease-out forwards, beam-fade .45s ease-in .65s forwards; }
  @keyframes beam-draw { to { stroke-dashoffset: 0; } }
  @keyframes beam-fade { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .motion-reduce-none { animation: none !important; } }
</style>
</head>
